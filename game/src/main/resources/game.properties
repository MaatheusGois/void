spawns.drops=drops.toml

# Path to penguin hide and seek locations
spawns.penguins.easy=penguin_locations_easy.toml
spawns.penguins.hard=penguin_locations_hard.toml

# Path to fight cave wave spawns file
spawns.fight.cave.waves=tzhaar_fight_cave_waves.toml


#===================================
