#===================================
# Server Settings
#===================================

# The name of the game server
server.name=RuneScape

# The website of the game server
#server.website=github.com/GregHib/void

# The name of the game company
server.company=Void

# The game revision (affects client compatibility)
server.revision=667

# Stable high performance mode but slower to start-up and uses more memory
server.live=false

#===================================
# Network Settings
#===================================

# The port the game server will listen on
network.port=50016

# Number of accounts one ip address can log into at the same time.
network.maxClientPerIP=10

# Maximum number of players to allow login per tick
network.maxLoginsPerTick=25


#===================================
# Development & Debugging
#===================================

# The admin username (always sets administrative privileges on login)
development.admin.name=Ebp90

# Load all objects into memory
development.loadAllObjects=true

# Give bots dummy network connections
development.bots.live=false

# Allow creating an account by login in with any username
development.accountCreation=true


#===================================
# World Settings
#===================================

# The ID of the world (useful for multi-world setups)
world.id=16

# The Name of the world
world.name=World 1

# Whether this world is members-only
world.members=true

# The default home spawn coordinates (X, Y, Level)
world.home.x=3221
world.home.y=3219
#world.home.level=0

# Whether content should broadcast global messages
world.messages=false

# Whether content should give more helpful messages
world.additional.messages=false

# Experience multiplier (1.0 = normal XP rate)
world.experienceRate=1.0

# Monster item drop rate chance multiplier (>= 1.0)
#  Note: can reduce chances of more common items.
#  Also applies to: barrows chests, impling jars, caskets, birds nests & sorceress's garden.
world.itemDropRate=1.0

#------- Player Rules -------

# The maximum number of players that can be online at once
world.players.max=2048

# Whether players can be collided with
world.players.collision=true

# Whether player run energy should drain or not
world.players.infiniteRunEnergy=false

# Show new accounts the character creation screen
world.start.creation=false

# Give new accounts starting gear
world.start.gear=true

# Clan chat channel for new accounts to automatically join (the channel owner's display name; blank to disable)
world.start.clanChat=

#------- NPC Rules -------

# Whether NPCs can be collided with
world.npcs.collision=true

# Whether NPCs can move randomly
world.npcs.randomWalk=false

# Whether Lumbridge is an NPC aggression-free area
world.npcs.safeZone=true

# Whether NPCs can attack players
world.npcs.aggression=true

# Sheep wool regrow timer
world.npcs.sheep.regrowTicks=50

#------- Object Rules -------

# Berry respawn timer
world.objs.cadava.regrowTicks=200
world.objs.redberry.regrowTicks=200

# Karamja banana tree regrow timer
world.objs.bananaTree.regrowTicks=300

# Dwarf multicannon decay warning and removal, ammo capacity, firing range and max hit
world.objs.cannon.warningTicks=2000
world.objs.cannon.decayTicks=2500
world.objs.cannon.maxAmmo=30
world.objs.cannon.range=10
world.objs.cannon.maxHit=300
# Coins Nulodion charges for a whole multicannon; the four pieces are cheaper bought separately.
world.objs.cannon.price=750000
# Half-width of the wedge the barrel covers. Wider than the 45 degrees between two octants, so
# neighbouring wedges overlap and a target in the overlap is fired on twice per revolution.
world.objs.cannon.arcDegrees=30

# Number of times a player can close a door before it gets stuck
world.objs.door.stuck.count=5

# Whether you can get dehydrated and take damage when in the desert
world.desertHeat=true


#===================================
# Gameplay Mechanics
#===================================

#------- Player Attributes -------

# Whether players energy drains while running
players.energy.drain=true

#------- Combat Mechanics -------

# Whether reducing hits by equipment absorption is enabled in combat mechanics
combat.damageSoak=true

# Whether to display blue damage soaking next to hit splats
combat.showSoak=true

# Whether to spawn gravestones on death
combat.gravestones=true

#------- Agility -------

# Disable players failing obstacles on agility courses
agility.disableCourseFailure=false

# Disable skipping laps when failing agility courses
agility.disableFailLapSkip=false

#------- Runecrafting -------

# Degrade runecrafting essence pouches when in use
runecrafting.pouch.degrade=true

#------- Farming -------

# Base farming growth tick time
farming.growth.mins=5

# Compost rotting tick time
farming.decompose.mins=2

# Stop weeds regrowing after being raked
farming.weeds.regrow=true

# Deposit multiple items into a compost bin in one go
farming.compost.all=false

#------- Magic -------

# Starting value of an item when alchemy starts giving warnings (-1 for never)
magic.alchemy.warningLimit=25000

#------- Slayer -------

# Fighting strykewyrms requires a slayer task
slayer.strykewyrmReqTask=true

#------- Summoning -------

# Max value of an item (or stack) a beast of burden familiar can carry
summoning.beastOfBurden.maxValue=5000000


#------- Hunter -------

# How frequently new impling spawns are refreshed
hunter.impling.respawnCycleMinutes=2

# How long after respawn implings are revealed
hunter.impling.revealMinutes=1

# How long after respawn implings are revealed
hunter.butterfly.revealTicks=2

#------- Fletching -------

# Enable fletching higher level logs into arrow shafts
fletching.moreArrowShafts=false

#------- Thieving -------

# 1 in X chance of pickpocketing double, triple or quadruple loot level depending
thieving.pickpocket.multiChance=10

#------- Dungeoneering -------

# Countdown time before party starts new dungeon
dungeoneering.secondsBetweenDungeons=30

# Display floor prestige warning as a statement (2011) rather than message (2012)
dungeoneering.warningStatement=true

#===================================
# Content & Events
#===================================

# Skip requirements for quests that aren't implemented
quests.requirements.skipMissing = true

# Whether Bonus XP Weekend is active, boosting experience gained the multiplier
# starts at 2.7x and decreases every 30 minutes spent online, down to 1.1x
events.bonusExperience.enabled=false

# Whether hiding penguins appear as an event in the game world
events.penguinHideAndSeek.enabled=true

# Day of the week penguins reset on from 1 (Monday) to 7 (Sunday)
events.penguinHideAndSeek.resetDay=3

# Whether shooting stars appear as an event in the game world
events.shootingStars.enabled=true

# The time (in minutes) before a Shooting Star respawns.
# A new star will appear a random time between the min and max values, after the last star.
# (identical values will spawn exactly every X minutes)
events.shootingStars.minRespawnTimeMinutes=60
events.shootingStars.maxRespawnTimeMinutes=120

# Whether random events are enabled for the server
events.randomEvents.active=true

# Whether players can turn off random events for themselves with the ::randomevents command
events.randomEvents.optOut=false

# Min minutes until you can receive another a random event
events.randomEvents.cooldownMinutesMin=60

# Max minutes until you can receive another a random event
events.randomEvents.cooldownMinutesMax=120

# 1 in X chance of receiving the lost and found teleport random event
events.randomEvents.teleportChance=300

# Whether Stronghold of Security doors should give questions or not
strongholdOfSecurity.quiz=true

# Whether Stronghold of Security doors should give questions after a level is completed
strongholdOfSecurity.quiz.complete=false

# Whether Grand Exchange trading is enabled
grandExchange.enabled=true

# Number of days logged-out before a players grand exchange offers expire, 0 for never
grandExchange.offers.activeDays=7

# Should grand exchange take coins from players banks when buying items
grandExchange.useBankCoins=true

# Limit number of items players can buy every X hours, 0 for no limits
grandExchange.buyLimit.hours=4

# Limit purchase price, if inactive players can buy at any price
grandExchange.priceLimit=false

# Percentage of coins taken from all sales, e.g. 0.01 = 1% tax.
grandExchange.tax=0.0

# Maximum amount of coins that can be taken per transaction, -1 for no cap
grandExchange.tax.limit=5000000

# Require the tutorial before accessing the grand exchange
grandExchange.tutorial.required=false

# Allow players to buy and sell instantly at .instantBuy/SellMarketPrice
#   Note: just for fun - spawns items and can allow infinite item/gold abuse.
grandExchange.instantOffer=false

# Instantly sells if X percentage under market price e.g.
#   0.0 = 0% - anything can be sold at or under the market price.
#   0.1 = 10% - 100gp item instantly sells for 90gp or under
#   -2.0 = -200% - allows selling 100gp item for up to 200gp.
grandExchange.instantSellUnderMarketPrice=0.0

# Instantly buys if X percentage over market price e.g.
#   0.0 = 0% - anything can be bought at or over the market price.
#   0.1 = 10% - instantly buys a 100gp item over 110gp.
#   -1.0 = -100% - allows buying anything at any price over 1gp.
grandExchange.instantBuyOverMarketPrice=0.0

# Wave to start all fight caves on (63 for jad)
fightCave.startWave = 1

# How frequently to respawn living rock cavern deposits (0 = never respawn, -1 = completely disabled)
events.livingRockCaverns.respawnTimeMinutes=20

# How frequently to respawn Rock Patriarch (0 = never respawn, -1 = completely disabled)
events.livingRockCaverns.patriarchTimeMinutes=60

# Number of living rock caverns coal spawns (7 for all)
events.livingRockCaverns.coalDeposits=2

# Number of living rock caverns gold spawns (4 for all)
events.livingRockCaverns.goldDeposits=1

# Whether tears of guthix minigame is active
events.tearsOfGuthix.active=true

#===================================
# AI & Bots
#===================================

# The number of AI-controlled bots spawned on startup
bots.count=30

# Frequency between spawning bots on startup
bots.spawnSeconds=60

# If no activities can be found, spawn necessary items and levels
bots.spawnRequirements=true

# Use bot <number> names instead of randomised
bots.numberedNames=false

# Location of a text file containing bot names to pick from
bots.names=./data/bot_names.txt

# Prefix at the start of bot's names (blank to hide)
bots.namePrefix=""

# File ending for bot definitions
bots.definitions=bots.toml

# File ending for bot definition templates
bots.templates=templates.toml

# File ending for bot definition templates
bots.setups=setups.toml

# File ending for bot definition templates
bots.shortcuts=shortcuts.toml

# File ending for bot navigation graph definitions
bots.nav.definitions=nav-edges.toml

# Target population of combat bots inside the Clan Wars FFA Safe arena. 0 disables.
bots.combat.clan_wars_ffa_safe.count=0

# Seconds between combat bot spawns for the FFA Safe arena while ramping to count.
bots.combat.clan_wars_ffa_safe.spawnSeconds=10

# Target population of combat bots inside the Clan Wars FFA Dangerous arena. 0 disables.
bots.combat.clan_wars_ffa_dangerous.count=0

# Seconds between combat bot spawns for the FFA Dangerous arena while ramping to count.
bots.combat.clan_wars_ffa_dangerous.spawnSeconds=10

#===================================
# Storage & File System
#===================================

# The type of storage backend (options: files, database)
storage.type=files

# How frequently to save players files - 0 to only save on logout
# 0 is recommended to avoid players in instances getting stuck.
storage.autoSave.minutes=5

# How frequently to reload offline account definitions (password hashes, display
# names, clans) from storage so website password resets and imported accounts take
# effect without a restart - -1 to disable.
storage.accounts.reloadMinutes=-1

# The base directory for all game config data
storage.data=./data/

# File storing timestamp of when config files or cache last changed
storage.data.modified=./data/.temp/modified.dat

# The directory where player save files are stored
storage.players.path=./data/saves/

# Directory where player logs are stored
storage.players.logs=./data/saves/logs/

# How frequently to save logs to file
storage.players.logs.seconds=10

# The directory where failed player save files are stored
storage.players.errors=./data/errors/

# Storage for wildcard look-ups
storage.wildcards=./data/.temp/wildcards.txt

# The directory where game cache data is stored
storage.cache.path=./data/cache/

# The type of file server backend (options: internal, external)
storage.cache.server=internal

# The scripts location for loading fallback
storage.scripts.path=./game/src/main/kotlin/content/

# Directory where grand exchange data is stored
storage.grand.exchange.offers.path=grand_exchange/offers.toml
storage.grand.exchange.offers.buy.path=grand_exchange/buy_offers/
storage.grand.exchange.offers.sell.path=grand_exchange/sell_offers/
storage.grand.exchange.offers.claim.path=grand_exchange/claimable_offers.toml
storage.grand.exchange.history.path=grand_exchange/price_history

# Directory where abuse reports are stored
storage.reports.path=reports/

# Database configuration (uncomment to enable database storage)
#storage.database.username=postgres
#storage.database.password=password
#storage.database.driver=org.postgresql.Driver
#storage.database.jdbcUrl=jdbc:postgresql://localhost:5432/game?reWriteBatchedInserts=true
#storage.database.poolSize=4

#===================================
# Configuration Caching
#===================================

# Whether to use more memory to store temporary files for faster loading
storage.caching.active=true

# Directory where temporary cached files are stored
storage.caching.path=./data/.temp/

# Cached game object data
storage.caching.objects = map_objects.dat

# Cached map collision data
storage.caching.collisions = collisions.dat

# Cached npc spawn data
storage.caching.npcSpawns = npc_spawns.dat


